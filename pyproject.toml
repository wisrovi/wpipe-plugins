[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wpipe-plugins"
version = "0.1.0"
authors = [
    { name = "William Steve Rodriguez Villamizar", email = "wisrovi.rodriguez@gmail.com" },
]
description = "Plugins and extensions for the wpipe ecosystem, including AI agents and vision models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12, <3.14"
keywords = ["pipeline", "plugins", "wpipe", "vision", "ai", "yolo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "wpipe==2.4.0",
    "loguru==0.7.3",
    "ultralytics==8.4.67",
    "grad-cam==1.5.5",
    "opencv-python==4.13.0.92",
    "pydantic==2.13.4",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "numpy==2.4.6",
    "pillow==12.2.0",
    "requests==2.34.2",
    "pandas==3.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.15.17",
    "mypy==2.1.0",
]
docs = [
    "sphinx==9.1.0",
    "sphinx-rtd-theme==3.1.0",
    "sphinx-copybutton==0.5.2",
    "myst-parser==5.1.0",
    "sphinx-sitemap==2.9.0",
    "sphinx-design==0.7.0",
]

[project.urls]
Homepage = "https://github.com/wisrovi/wpipe-plugins"
Repository = "https://github.com/wisrovi/wpipe-plugins"
Issues = "https://github.com/wisrovi/wpipe-plugins/issues"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]
exclude = ["**/*.db", "**/*.log", "**/*.zip", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/wpipe_plugins"]
exclude = ["**/*.db", "**/*.log", "**/*.zip", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/wpipe_plugins"]
branch = true
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 70

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
